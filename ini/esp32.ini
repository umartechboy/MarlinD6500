#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      ESP32 Architecture       #
#                               #
#################################

#
# Espressif ESP32
#
[env:esp32]
platform         = espressif32@6.5.0
board            = esp32dev
build_flags      = ${common.build_flags} -DCORE_DEBUG_LEVEL=0
build_src_filter = ${common.default_src_filter} +<src/HAL/ESP32>
lib_ignore       = NativeEthernet
upload_speed     = 921600
monitor_speed    = 250000
monitor_filters  = colorize, time, send_on_enter, log2file, esp32_exception_decoder

[env:esp32s3]
platform         = espressif32@6.5.0
board            = esp32-s3-devkitc-1
build_flags      = ${common.build_flags} -DCORE_DEBUG_LEVEL=0
build_src_filter = ${common.default_src_filter} +<src/HAL/ESP32>
lib_ignore       = NativeEthernet
upload_speed     = 921600
monitor_speed    = 250000
monitor_filters  = colorize, time, send_on_enter, log2file, esp32_exception_decoder

[env:D6500]
extends                = env:esp32
board_build.partitions = default.csv

[env:D8500]
extends                = env:esp32
board_build.partitions = default_bigapp.csv
lib_deps               =
                        qqqlab/ESP32_SoftWire@^1.0.2
                        adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
                        bitbank2/PNGdec@^1.1.3

[env:D8500s]
extends                = env:D8500
board                     = esp32-s3-devkitc-1
board_upload.flash_size   = 4MB
board_build.flash_size    = 4MB
board_build.flash_mode    = dio
board_build.arduino.memory_type = dio_qspi
board_build.partitions = D8500s.csv
build_flags            = ${env:D8500.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DLite_Version=1

[env:FYSETC_E4]
extends                = env:esp32
board_build.partitions = default_16MB.csv

[env:PANDA]
extends                = env:esp32
build_flags            = ${env:esp32.build_flags} -DUSE_ESP32_EXIO -DUSE_ESP32_TASK_WDT
lib_deps               = ${common.lib_deps}
                         SoftwareSerialEsp32
                         arduino-libraries/ArduinoBLE@^1.1.3

board_build.partitions = no_ota.csv
upload_speed           = 115200
monitor_speed          = 115200

[env:mks_tinybee]
extends                = env:esp32
board_build.partitions = default_8MB.csv
